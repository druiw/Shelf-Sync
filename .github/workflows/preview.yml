# Stage 2 ("dev"): on every PR, re-run the checks, deploy a Vercel preview,
# and comment the preview URL on the PR.
name: Preview

on:
  pull_request:
    branches:
      - main

# A new push to the PR cancels the older, now-outdated preview run.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy-preview:
    name: Deploy preview
    needs: checks # only deploy if lint, tests, and build passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the comment
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@61.1.0

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --edit-last --create-if-none \
            --body "🚀 Preview deployed: ${{ steps.deploy.outputs.url }} (commit ${{ github.event.pull_request.head.sha }})"
