# Stage 1 ("sandbox"): lint, test, and build on every push to a feature branch.
name: CI

on:
  push:
    branches-ignore:
      - main

# The workflow only needs to read the code, so don't give it write access.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc # same Node version as local and Vercel
          cache: npm # caches downloads, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
